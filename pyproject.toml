[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-qa-agent"
version = "0.1.0"
description = "Agente white label de QA automatizado para apps móviles (Appium): perfiles por app, levantamiento asistido y consola web"
requires-python = ">=3.11"
dependencies = [
  "Appium-Python-Client>=4",
  "pydantic>=2.9",
  "PyYAML>=6",
  "Pillow>=11",
  "python-dotenv>=1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-play-scraper>=1.2",
]

[tool.setuptools.package-data]
"qa_agent.web" = ["static/*"]

[project.scripts]
qa-agent = "qa_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
